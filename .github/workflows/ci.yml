name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      skip: ${{ steps.tested-tree.outputs.skip }}
    steps:
      - name: tested-tree
        id: tested-tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          fail() { echo "running everything: $1"; exit 0; }
          head="$(api "commits/$GITHUB_SHA/pulls" '[.[] | select(.merged_at != null and .merge_commit_sha == "'"$GITHUB_SHA"'" and .base.ref == "main")] | if length == 1 then .[0].head.sha else empty end')" || fail "pull request lookup failed"
          [ -n "$head" ] || fail "no single merged pull request for $GITHUB_SHA"
          main_tree="$(api "git/commits/$GITHUB_SHA" .tree.sha)" || fail "tree lookup failed for $GITHUB_SHA"
          head_tree="$(api "git/commits/$head" .tree.sha)" || fail "tree lookup failed for $head"
          [ -n "$main_tree" ] && [ "$main_tree" = "$head_tree" ] || fail "tree $main_tree differs from pull request head $head ($head_tree)"
          conclusion="$(api "actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&per_page=1" '.workflow_runs[0].conclusion // empty')" || fail "pull request run lookup failed"
          [ "$conclusion" = "success" ] || fail "pull request run for $head concluded '${conclusion:-none}'"
          echo "tree $main_tree already passed ci on pull request head $head, skipping the test suites"
          echo "skip=true" >> "$GITHUB_OUTPUT"

  test:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26.13.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: generated code is up to date
        if: matrix.node == '26.13.0'
        run: |
          npm run generate
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "untracked generated files:"
            echo "$untracked"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: mkdir -p "$RUNNER_TEMP/dist" && npm pack --pack-destination "$RUNNER_TEMP/dist"
